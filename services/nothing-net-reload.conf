# Settings for ~/.local/bin/nothing-net-reload (sourced as shell).
# After editing:  systemctl --user restart nothing-net-reload.service

# 0 turns the whole thing off without uninstalling it.
ENABLED=1

# Seconds the link must stay up before widgets are reloaded.
DEBOUNCE=6

# Minimum seconds between two reloads. Raise it if reconnecting mid-session
# (waking from suspend, hopping networks) restarts the shell more than you like.
COOLDOWN=600

# Fallback re-check interval, in case a D-Bus signal is missed.
POLL=45


