# Settings for ~/.local/bin/nothing-gestures (sourced as shell).
# After editing:  systemctl --user restart nothing-gestures.service

# 0 turns the gestures off without uninstalling anything.
ENABLED=1

# How many fingers the swipe needs. KWin already uses 3-finger LEFT/RIGHT for
# virtual desktops; this only ever acts on up/down, so the two coexist.
FINGERS=3

# Accumulated travel needed before a swipe counts, in libinput units.
# Measured on this touchpad: real swipes land between 4.6 and 15.0.
# Run `nothing-gestures --calibrate` and swipe to see your own numbers.
THRESHOLD=3

# How much more vertical than horizontal a swipe must be, in tenths.
# 15 = 1.5x. This is what keeps it clear of the left/right desktop gestures.
AXIS_RATIO=15
